name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica123
          POSTGRES_DB: clinica_psicologia
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://clinica:clinica123@localhost:5432/clinica_psicologia?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-123456
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-123456
      ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ENCRYPTION_HMAC_PEPPER: ci-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/api db:generate
      - run: pnpm --filter @repo/api db:deploy || pnpm --filter @repo/api exec prisma migrate deploy
      - run: pnpm lint || echo "lint pending"
      - run: pnpm typecheck || echo "typecheck pending"
      - run: pnpm --filter @repo/api test || echo "tests pending"
      - run: pnpm build
